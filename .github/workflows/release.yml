name: Release skills

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the ChatGPT plugin's release notes cover the
          # commits since the previous v* tag.
          fetch-depth: 0

      - name: Validate skills
        run: ./scripts/validate-skills.sh

      - name: Validate Microsoft 365 declarative agent
        run: ./scripts/validate-m365-agent.sh

      - name: Package per-skill zips
        run: ./scripts/package-skills.sh

      - name: Package M365 Copilot Cowork plugin
        run: ./scripts/package-cowork-plugin.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package Microsoft 365 Marketplace app
        run: ./scripts/package-m365-app.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package Microsoft 365 Copilot agent
        if: vars.TEAMS_APP_ID != '' || vars.GETWHYS_DCR_AUTH_ID != ''
        run: ./scripts/package-m365-agent.sh
        env:
          TEAMS_APP_ID: ${{ vars.TEAMS_APP_ID }}
          GETWHYS_DCR_AUTH_ID: ${{ vars.GETWHYS_DCR_AUTH_ID }}
          VERSION: ${{ github.ref_name }}
          APP_NAME_SUFFIX: ""

      - name: Note skipped Microsoft 365 Copilot agent
        if: vars.TEAMS_APP_ID == '' && vars.GETWHYS_DCR_AUTH_ID == ''
        run: echo "::warning::Microsoft agent ZIP skipped; provisioning IDs are not set."

      - name: Package Claude Tag plugin
        run: ./scripts/package-plugin.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package ChatGPT plugin
        run: ./scripts/package-openai-plugin.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
