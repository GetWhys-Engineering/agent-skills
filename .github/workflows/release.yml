name: Release skills

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the ChatGPT plugin's release notes cover the
          # commits since the previous v* tag.
          fetch-depth: 0

      - name: Validate skills
        run: ./scripts/validate-skills.sh

      - name: Validate Microsoft 365 declarative agent
        run: ./scripts/validate-m365-agent.sh

      - name: Package per-skill zips
        run: ./scripts/package-skills.sh

      - name: Package M365 Copilot Cowork plugin
        run: ./scripts/package-cowork-plugin.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package Microsoft 365 Marketplace app
        run: ./scripts/package-m365-app.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package Microsoft 365 Copilot agent
        # The production IDs live in the committed env/.env.prod. Until the
        # production provision fills them in, the release skips the agent ZIP.
        run: |
          set -a
          . packaging/m365-agent/env/.env.prod
          set +a
          if [ -z "$TEAMS_APP_ID" ] && [ -z "$GETWHYS_DCR_AUTH_ID" ]; then
            echo "::warning::Microsoft agent ZIP skipped; packaging/m365-agent/env/.env.prod has no provisioned IDs yet."
            exit 0
          fi
          APP_NAME_SUFFIX="" ./scripts/package-m365-agent.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package Claude Tag plugin
        run: ./scripts/package-plugin.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package ChatGPT plugin
        run: ./scripts/package-openai-plugin.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
