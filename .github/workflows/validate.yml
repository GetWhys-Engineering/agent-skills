name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate skills
        run: ./scripts/validate-skills.sh
      - name: Package Claude Tag plugin
        run: ./scripts/package-plugin.sh
